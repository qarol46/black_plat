# ─────────────────────────────────────────────────────────────────────────────
# Основные параметры
# ─────────────────────────────────────────────────────────────────────────────
set -g base-index 1           # нумерация окон с 1
setw -g pane-base-index 1     # нумерация панелей с 1
set -g renumber-windows on    # перенумеровать окна при закрытии
set -s escape-time 0          # без задержки после Escape
set -g history-limit 2000     # история прокрутки
set -g mouse on               # поддержка мыши (прокрутка, клик по панелям, resize)
                              # Для выделения текста мышью в буфер терминала (а не tmux)
                              # удерживай Shift при выделении

set -g pane-border-lines double
setw -g mode-keys vi          # vi-навигация в режиме копирования

# ─────────────────────────────────────────────────────────────────────────────
# Клавиши без префикса (Alt + ...)
# ─────────────────────────────────────────────────────────────────────────────

# Перезагрузить конфиг
bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Дерево сессий
bind -n M-s choose-tree -s

# Переключение между окнами по номеру
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Переключение между панелями
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Изменение размера панелей
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 3
bind -n M-S-Down  resize-pane -D 3

# Разделение панелей
bind -n M-h split-window -v   # разделить горизонтально
bind -n M-v split-window -h   # разделить вертикально

# Управление окнами и сессией
bind -n M-Enter new-window
bind -n M-c     kill-pane
bind -n M-q     kill-window
bind -n M-d     detach
bind -n M-Q     confirm-before -p "Kill entire session? (y/n)" kill-session

# ─────────────────────────────────────────────────────────────────────────────
# Режим копирования (vi)
# ─────────────────────────────────────────────────────────────────────────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy || xclip -in -selection clipboard"
# Многострочное копирование - при выделении содержимое сразу отправляется в буфер
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy || xclip -in -selection clipboard"
# Поиск (переход в copy-mode + prompt)
bind -n M-/ copy-mode \; command-prompt -p "(search down)" "send -X search-forward '%%%'"
bind -n M-? copy-mode \; command-prompt -p "(search up)"   "send -X search-backward '%%%'"

# ─────────────────────────────────────────────────────────────────────────────
# Плагины (tpm)
# ─────────────────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.config/tmux/plugins/tpm/tpm'
