/obstacles_detection:
  ros__parameters:
    Grid/3D: 'true'
    Grid/CellSize: '0.05'
    Grid/ClusterRadius: '0.1'
    Grid/DepthDecimation: '1'
    Grid/DepthRoiRatios: 0.0 0.0 0.0 0.0
    Grid/FlatObstacleDetected: 'true'
    Grid/FootprintHeight: '0.0'
    Grid/FootprintLength: '0.0'
    Grid/FootprintWidth: '0.0'
    Grid/GroundIsObstacle: 'false'
    Grid/MapFrameProjection: 'false'
    Grid/MaxGroundAngle: '45'
    Grid/MaxGroundHeight: '0.0'
    Grid/MaxObstacleHeight: '2'
    Grid/MinClusterSize: '20'
    Grid/MinGroundHeight: '0.0'
    Grid/NoiseFilteringMinNeighbors: '5'
    Grid/NoiseFilteringRadius: '0.0'
    Grid/NormalK: '20'
    Grid/NormalsSegmentation: 'true'
    Grid/PreVoxelFiltering: 'true'
    Grid/RangeMax: '2'
    Grid/RangeMin: '0.0'
    Grid/RayTracing: 'false'
    Grid/Scan2dUnknownSpaceFilled: 'false'
    Grid/ScanDecimation: '1'
    Grid/Sensor: '1'
    frame_id: base_link
    map_frame_id: ''
    qos: 0
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
    use_sim_time: true
    wait_for_transform: 0.5

