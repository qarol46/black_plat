/point_cloud_xyz:
  ros__parameters:
    approx_sync: true
    approx_sync_max_interval: 0.0
    decimation: 2
    filter_nans: false
    max_depth: 3.0
    min_depth: 0.0
    noise_filter_min_neighbors: 5
    noise_filter_radius: 0.0
    normal_k: 0
    normal_radius: 0.0
    qos: 0
    qos_camera_info: 0
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
    queue_size: -1
    roi_ratios: ''
    sync_queue_size: 10
    topic_queue_size: 1
    use_sim_time: false
    voxel_size: 0.02

