collision_monitor:
  ros__parameters:
    enabled: True
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/cmd_vel_smoothed"
    #cmd_vel_out_topic: "/diff_drive_controller/cmd_vel_unstamped"
    transform_tolerance: 0.5
    source_timeout: 5.0
    state_topic: "collision_polygon"
    stop_pub_timeout: 2.0
    state_publish_period: 0.5
    polygons: ["PolygonStop"]
    PolygonStop:
      type: "polygon"
      points: [
        0.5, 0.35, 
        0.5, -0.35, 

        -0.4, -0.35, # right rear corner
        -0.4, -0.25,
        -0.15, -0.25,
        -0.15, -0.07,
        -0.32, -0.07,
        -0.32, -0.25,
        -0.4, -0.25,

        -0.4, 0.25, # left rear corner
        -0.32, 0.25,
        -0.32, 0.07,
        -0.15, 0.07,
        -0.15, 0.25,
        -0.4, 0.25,
        -0.4, 0.35]
      action_type: "stop"
      max_points: 4
      visualize: True
      polygon_pub_topic: "polygon_front"
    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: "/lio_sam/mapping/cloud_registered"
      transport_type: "raw"  # raw or/ with compression (zlib, draco, zstd)
      min_height: -0.3
      max_height: 0.3
      enabled: True