bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /lio_sam/mapping/odometry
    default_nav_to_pose_bt_xml: "/home/danil/t21_ws/black_plat_nav/src/t21_nav2/BT/custom_navigate_w_replanning.xml"
    #default_nav_through_poses_bt_xml: "/home/danil/t21_ws/black_plat/src/t21_nav2/BT/custom_navigate_w_replanning.xml"
    bt_loop_duration: 20
    default_server_timeout: 10
    wait_for_service_timeout: 1000
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    transform_tolerance: 0.4
    filter_duration: 0.2
    service_intropection_mode: "disabled"
    always_reload_bt_xml: false
    goal_blackboard_id: goal
    goals_blackboard_id: goals
    path_blackboard_id: path
    waypoint_statuses_blackboard_id: waypoint_statuses
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator" # In Iron and older versions, "/" was used instead of "::"
      enable_groot_monitoring: false
      groot_server_port: 1667
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator" # In Iron and older versions, "/" was used instead of "::"
      enable_groot_monitoring: false
      groot_server_port: 1669
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_is_battery_charging_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - spin_towards_trajectory_plugin
    
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_theta_velocity_threshold: 0.3
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.2
      stateful: True
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 50
      model_dt: 0.05
      batch_size: 2500
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 0.4
      vx_min: -0.4
      vy_max: 0.0
      wz_max: 1.0
      ax_max: 1.0
      ax_min: -1.0
      ay_min: 0.0
      ay_max: 0.0
      az_max: 1.0
      iteration_count: 1
      temperature: 0.2
      gamma: 0.02
      motion_model: "DiffDrive"
      visualize: true
      publish_optimal_trajectory: true
      reset_period: 1.0 # (only in Humble)
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 8
        time_step: 5
      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 3.0
        consider_footprint: true
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "ObstaclesCritic"]
      ConstraintCritic:
        enabled: false
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 2
        cost_weight: 5.0
        threshold_to_consider: 1.5
      GoalAngleCritic:
        enabled: true
        cost_power: 2
        cost_weight: 5.0
        threshold_to_consider: 0.2
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      # ObstaclesCritic:
      #    enabled: true
      #    cost_power: 3
      #    repulsion_weight: 100.0
      #    critical_weight: 2000.0
      #    consider_footprint: false
      #    collision_cost: 100000.0
      #    collision_margin_distance: 0.5
      #    near_goal_distance: 0.5
      #    inflation_radius: 1.5 # (only in Humble)
      #    cost_scaling_factor: 3.0 # (only in Humble)
      #    inflation_layer_name: 'inflation_layer'
      CostCritic:
        enabled: true
        cost_power: 3
        cost_weight: 30.0
        near_collision_cost: 10
        critical_cost: 50.0
        consider_footprint: true
        collision_cost: 100.0
        near_goal_distance: 0.1
        trajectory_point_step: 1
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 2
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.5
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 10
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.2
        mode: 0
      # VelocityDeadbandCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 35.0
      #   deadband_velocities: [0.05, 0.05, 0.05]
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0
      

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 15.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.1
      use_maximum: true
      trinary_costmap: false
      lethal_cost_threshold: 200
      footprint: "[[0.3,0.25],[0.3,-0.25],[-0.3,-0.25],[-0.3,0.25]]"
      robot_radius: 0.0
      plugins: ["obstacle_layer", "voxel_layer", "inflation_layer"] #, "rgbd_obstacle_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true  # Ensure enabled
        footprint_clearing_enabled: false
        observation_sources: scan
        combination_method: 1
        scan:
          topic: /scan_velodyne
          data_type: "LaserScan"
          marking: true
          clearing: true
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        footprint_clearing_enabled: false
        publish_voxel_map: True
        origin_z: -0.1
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.5
        unknown_threshold: 5
        mark_threshold: 1
        observation_sources: pointcloud
        combination_method: 1
        pointcloud:  # no frame set, uses frame from message
          topic: /velodyne_points
          qos: "sensor_data"  # BEST_EFFORT + VOLATILE
          max_obstacle_height: 0.5
          min_obstacle_height: -0.1
          obstacle_max_range: 5.0
          obstacle_min_range: 0.6
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.3
        cost_scaling_factor: 3.0
        inflate_unknown: False
        inflate_around_unknown: False     
      introspection_mode: "metadata"
      
global_costmap:
  global_costmap:
    ros__parameters:
        use_sim_time: True
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: map
        map_topic: /map
        robot_base_frame: base_link
        rolling_window: true
        width: 50
        height: 50
        resolution: 0.05
        #TODO adapt base on altering lenght of chassis
        footprint: "[[0.4,0.3],[0.4,-0.30],[-0.4,-0.30],[-0.4,0.30]]"
        robot_radius: 0.0
        track_unknown_space: true
        map_vis_z: 0.0
        plugins: ["static_layer", "obstacle_layer", "voxel_layer", "global_inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: pointcloud
          footprint_clearing_enabled: True
          max_obstacle_height: 5.0
          combination_method: 1
          pintcloud:
            topic: /velodyne_points
            qos: "sensor_data"  # BEST_EFFORT + VOLATILE
            obstacle_max_range: 5.0
            obstacle_min_range: 0.9
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            max_obstacle_height: 0.5
            min_obstacle_height: 0.1
            clearing: True
            marking: True
            data_type: "PointCloud2"
            inf_is_valid: False
        voxel_layer:
          plugin: "nav2_costmap_2d::VoxelLayer"
          enabled: true
          footprint_clearing_enabled: False
          publish_voxel_map: True
          origin_z: -0.1
          z_resolution: 0.05
          z_voxels: 16
          max_obstacle_height: 0.5
          unknown_threshold: 5
          mark_threshold: 0
          observation_sources: pointcloud
          combination_method: 1
          pointcloud:  # no frame set, uses frame from message
            topic: /velodyne_points
            qos: "sensor_data"  # BEST_EFFORT + VOLATILE
            max_obstacle_height: 0.5
            min_obstacle_height: 0.1
            obstacle_max_range: 5.0
            obstacle_min_range: 0.5
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            clearing: True
            marking: True
            data_type: "PointCloud2"
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: True
          enabled: True
          subscribe_to_updates: True
          transform_tolerance: 0.5
        global_inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          enabled: True
          inflation_radius: 0.5
          cost_scaling_factor: 3.0
          inflate_unknown: false
          inflate_around_unknown: false
        always_send_full_costmap: false
        introspection_mode: "disabled"
      


map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:             
        plugin: "nav2_navfn_planner/NavfnPlanner" # In Iron and older versions, "/" was used instead of "::"
        tolerance: 0.1
        use_astar: false
        allow_unknown: True

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: /local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    use_sim_time: True
    
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"   
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 10.0
    use_stamped_cmd_vel: false
    cmd_vel_topic: "/cmd_vel_smoothed"
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: /lio_sam/mapping/odometry
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager:
  ros__parameters:
    autostart: true
    node_names: ['controller_server', 'planner_server', 'behavior_server', 'bt_navigator', 'waypoint_follower', 'velocity_smoother']
    bond_timeout: 20.0
    attempt_respawn_reconnection: true
    bond_respawn_max_duration: 30.0
    introspection_mode: "disabled"
