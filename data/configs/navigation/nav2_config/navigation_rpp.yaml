# Из-за погрешностей локализации при большом повороте на целевую ориентацию вблизи целевой точки робот начиначет постоянно
# переключаться между режимами поворота на целевую ориентацию и поворота для выравнивания вдоль пути
bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /lio_sam/mapping/odometry
    default_nav_to_pose_bt_xml: "/home/danil/t21_ws/black_plat_nav/src/t21_nav2/BT/custom_navigate_w_replanning.xml"
    #default_nav_through_poses_bt_xml: "/home/danil/t21_ws/black_plat/src/t21_nav2/BT/custom_navigate_w_replanning.xml"
    bt_loop_duration: 20
    default_server_timeout: 10
    wait_for_service_timeout: 1000
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    transform_tolerance: 0.4
    filter_duration: 0.2
    service_intropection_mode: "disabled"
    always_reload_bt_xml: false
    goal_blackboard_id: goal
    goals_blackboard_id: goals
    path_blackboard_id: path
    waypoint_statuses_blackboard_id: waypoint_statuses
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator" # In Iron and older versions, "/" was used instead of "::"
      enable_groot_monitoring: false
      groot_server_port: 1667
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator" # In Iron and older versions, "/" was used instead of "::"
      enable_groot_monitoring: false
      groot_server_port: 1669
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_is_battery_charging_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - spin_towards_trajectory_plugin
    
controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.3
      required_movement_angle: 0.3
      movement_time_allowance: 15.0
    goal_checker:
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.1
        yaw_goal_tolerance: 0.2
        path_length_tolerance: 1.5
        stateful: True
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      footprint_cost_threshold: 2.0
      desired_linear_vel: 0.4
      lookahead_dist: 1.0
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.0
      lookahead_time: 1.0
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.01
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 2.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.0
      regulated_linear_scaling_min_speed: 0.1
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.25
      max_angular_accel: 1.0
      use_interpolation: true
      cost_scaling_dist: 0.5
      cost_scaling_gain: 0.75
      inflation_cost_scaling_factor: 3.0
      


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 15.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.01
      use_maximum: true
      trinary_costmap: false
      #lethal_cost_threshold: 200
      footprint: "[[0.25,0.15],[0.25,-0.15],[-0.25,-0.15],[-0.25,0.15]]"
      robot_radius: 0.0
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: pointcloud
          footprint_clearing_enabled: true
          combination_method: 1
          pointcloud:
            topic: /lio_sam/mapping/cloud_registered
            qos: "sensor_data"  # BEST_EFFORT + VOLATILE
            obstacle_max_range: 5.0
            obstacle_min_range: 0.6
            raytrace_max_range: 0.6
            raytrace_min_range: 0.0
            max_obstacle_height: 0.5
            min_obstacle_height: 0.1
            clearing: false
            marking: true
            data_type: "PointCloud2"
            inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.5
        cost_scaling_factor: 5.0
        inflate_unknown: False
        inflate_around_unknown: False     
      introspection_mode: "disabled"
      always_send_full_costmap: false
      
global_costmap:
  global_costmap:
    ros__parameters:
        use_sim_time: True
        update_frequency: 1.0
        publish_frequency: 2.0
        global_frame: map
        map_topic: /map
        robot_base_frame: base_link
        rolling_window: false
        width: 50
        height: 50
        resolution: 0.025
        trinary_costmap: true
        #TODO adapt base on altering lenght of chassis
        footprint: "[[0.25,0.15],[0.25,-0.15],[-0.25,-0.15],[-0.25,0.15]]"
        track_unknown_space: true
        map_vis_z: 0.0
        plugins: ["static_layer", "obstacle_layer", "voxel_layer", "global_inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: pointcloud
          footprint_clearing_enabled: true
          max_obstacle_height: 5.0
          combination_method: 1
          pointcloud:
            topic: /lio_sam/mapping/cloud_registered
            qos: "sensor_data"  # BEST_EFFORT + VOLATILE
            obstacle_max_range: 50.0
            obstacle_min_range: 0.6
            raytrace_max_range: 30.0
            raytrace_min_range: 0.0
            max_obstacle_height: 0.5
            min_obstacle_height: 0.1
            clearing: True
            marking: True
            data_type: "PointCloud2"
            inf_is_valid: false
        voxel_layer:
          plugin: "nav2_costmap_2d::VoxelLayer"
          enabled: true
          footprint_clearing_enabled: true
          publish_voxel_map: True
          origin_z: -0.1
          z_resolution: 0.05
          z_voxels: 16
          max_obstacle_height: 0.5
          unknown_threshold: 5
          mark_threshold: 3
          observation_sources: pointcloud
          combination_method: 1
          pointcloud:  # no frame set, uses frame from message
            topic: /lio_sam/mapping/cloud_registered
            qos: "sensor_data"  # BEST_EFFORT + VOLATILE
            max_obstacle_height: 0.5
            min_obstacle_height: 0.1
            obstacle_max_range: 5.0
            obstacle_min_range: 0.5
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            clearing: True
            marking: True
            data_type: "PointCloud2"
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: True
          enabled: true
          subscribe_to_updates: true
          transform_tolerance: 0.5
        global_inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          enabled: True
          inflation_radius: 0.75
          cost_scaling_factor: 3.0
          inflate_unknown: false
          inflate_around_unknown: false
        always_send_full_costmap: false
        introspection_mode: "disabled"
      


map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

