# 2) Trajectory Controller для флипперов
joint_trajectory_controller:
  ros__parameters:
    joints:
      - "front_left_flipper_joint"
      - "front_right_flipper_joint"
      - "rear_left_flipper_joint"
      - "rear_right_flipper_joint"
    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position

