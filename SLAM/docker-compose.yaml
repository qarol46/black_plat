      context: ${ROOT_DIR:-/home/tms/Projects/black_plat}/SLAM/t21_slam_toolbox/
      dockerfile: ${ROOT_DIR:-/home/tms/Projects/black_plat}/SLAM/t21_slam_toolbox/docker/Dockerfile
